<html>
    <head>
        <title> fifth example</title>
    </head>
    <body>
        <table border="1" cellpadding="0" cellspacing="2" width="400" height="400" align="center">
            <tr align="center">
                <td colspan="1" bgcolor="yellow">1</td>
                <td colspan="3" bgcolor="yellow">2</td>
                <td colspan="3" bgcolor="yellow">3</td>
            </tr>
            <tr align="center">
                <td colspan="2" rowspan="2" bgcolor="lightblue">4</td>
                <td colspan="6" bgcolor="lightblue">5</td>
            </tr>
            <tr align="center">
                <td colspan="4" bgcolor="lightgreen">6</td>
                <td rowspan="4" bgcolor="lightgreen">7</td>
            </tr>
            <tr align="center">
                <td rowspan="5" bgcolor="lightyellow">8</td>
                <td bgcolor="lightyellow">9</td>
                <td bgcolor="lightyellow">10</td>
                <td colspan="2" rowspan="2" bgcolor="lightyellow">11</td>
            </tr>
            <tr align="center">
                <td colspan="2" bgcolor="salmon">12</td>
            </tr>
            <tr align="center">
                <td rowspan="4" bgcolor="pink">13</td>
                <td colspan="6" bgcolor="pink">14</td>
            </tr>
            <tr align="center">
                <td colspan="4" bgcolor="darksafroon">15</td>
                <td bgcolor="darksafroon">16</td>
            </tr>
            <tr align="center">
                <td colspan="5" bgcolor="gold">17</td>
            </tr>
        </table>
    </body>
</html>
