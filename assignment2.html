<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Page</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header>
        <h1 class="logo">Shop<span>Max</span></h1>
    </header>

    <main class="product-container">
        <div class="product-card">
            <div class="product-image">Product Image</div>
            <h2 class="product-name">Wireless Headphones</h2>
            <div class="offer-section">
                <span class="price">$49.99</span>
            </div>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image">Product Image</div>
            <h2 class="product-name discount-badge">Smart Watch</h2>
            <div class="price-section">
                <span class="price">$199.99</span>
            </div>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image">Product Image</div>
            <h2 class="product-name">Gaming Mouse</h2>
            <div class="offer-section">
                <span class="price">$29.99</span>
            </div>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image">Product Image</div>
            <h2 class="product-name">Mechanical Keyboard</h2>
            <div class="price-section">
                <span class="price">$89.99</span>
            </div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </main>

</body>
</html>
