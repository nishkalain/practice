<html>
    <head>
        <title>
            columnrowspan
        </title>
    </head>
    <body>
       <table border="1" align="center" width="75%" cellpadding="15" cellspacing="0">
    <tr align="center">
        <td width="20%" bgcolor="lightpink"><strong>Logo</strong></td>
        <td colspan="3" bgcolor="lightyellow"><strong>Top Menu</strong></td>
    </tr>
    
    <tr align="center">
        <td rowspan="2" width="20%" bgcolor="lightyellow"><strong>Side Menu</strong></td>
        <td width="50%" bgcolor="lightblue">World News</td>
        <td width="50%" bgcolor="lightblue">Financial</td>
        
        <td rowspan="2" width="20%" bgcolor="pink" valign="top">List of Ads</td>
    </tr>
    
    <tr align="center">
        <td  width="50%" bgcolor="lightblue">Technology</td>
        <td width="50%" bgcolor="lightblue">Sports</td>
    </tr>
    
    <tr align="center">
        <td colspan="4" bgcolor="grey"><strong>Footer</strong></td>
    </tr>
</table>
    </body>
</html>
