<html>
    <head>
        <title>
            ROWSPAN
        </title>
    </head>
    <body>
        <table border="1" align="center" width="60%" bgcolor="green" bordercolor="white">
    <tr align="center">
        <td rowspan="9" width="7.6%">A</td>
        <td rowspan="8" width="7.6%">B</td>
        <td rowspan="7" width="7.6%">C</td>
        <td rowspan="6" width="7.6%">D</td>
        <td rowspan="5" width="7.6%">E</td>
        <td rowspan="4" width="7.6%">F</td>
        <td colspan="2">AH</td>
        <td rowspan="4" width="7.6%">H</td>
        <td rowspan="5" width="7.6%">I</td>
        <td rowspan="6" width="7.6%">J</td>
        <td rowspan="7" width="7.6%">K</td>
        <td rowspan="8" width="7.6%">L</td>
        <td rowspan="9" width="7.6%">M</td>
    </tr>
    <tr align="center">
        <td colspan="2">H</td>
    </tr>
    <tr align="center">
        <td colspan="2">GH</td>
    </tr>
    <tr align="left">
        <td colspan="2">N</td>
    </tr>
    <tr align="center">
        <td colspan="4">O</td>
    </tr>
    <tr align="center">
        <td colspan="6">P</td>
    </tr>
    <tr align="center">
        <td colspan="8">Q</td>
    </tr>
    <tr align="left">
        <td>R</td>
        
        <td colspan="0", align="center">S</td>
        <td colspan="0">T</td>
        <td colspan="2">U</td>
        <td colspan="0">V</td>
        <td colspan="0">W</td>
        <td colspan="2">X</td>
    </tr>
    <tr align="center">
        <td colspan="12">Y</td>
    </tr>
    <tr align="center">
        <td align="left">Z</td>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
        <td>5</td>
        <td colspan="2">6</td>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td colspan="2">10</td>
    </tr>
</table>
    </body>
</html>
