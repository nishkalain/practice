<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - No Tables</title>
    <style>
        
        body {
            background-color: #0f172a; 
            padding: 40px 20px;
            margin: 0;
        }
        
        .main-card {
            max-width: 650px;
            background-color: white;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #000;
        }

        .header-section p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }

        
        fieldset {
            border: 2px solid #2563eb; /* Blue border line */
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        legend {
            background-color: #2563eb; /* Blue background for text */
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Flexbox Layout Rows (Replaces Table Rows) */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1; /* Forces columns to split space equally */
            display: flex;
            flex-direction: column; /* Stack label above input */
        }

        /* Label & Input Controls */
        label {
            font-size: 14px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't break widths */
        }

        textarea {
            resize: none;
        }

        /* Button Grid Layout */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .btn-submit { background-color: #10b981; } /* Green */
        .btn-reset { background-color: #f43f5e; }  /* Red / Tomato */
    </style>
</head>
<body>

    <div class="main-card">
        
        <div class="header-section">
            <h1>Contact Me</h1>
            <p>Feel free to contact me for projects, collaborations, internships, or job opportunities.</p>
        </div>

        <form action="#" method="POST">

            <fieldset>
                <legend>Personal Details</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="full_name" placeholder="Enter Your Full Name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter Your Email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter Mobile Number">
                    </div>
                    <div class="form-group">
                        <label for="website">Portfolio Website</label>
                        <input type="url" id="website" name="website" placeholder="https://example.com">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Project Details</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="service">Select Service</label>
                        <select id="service" name="service">
                            <option>Select Service</option>
                            <option value="web">Web Development</option>
                            <option value="scraping">Web Scraping Pipeline</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="budget">Project Budget</label>
                        <input type="text" id="budget" name="budget" placeholder="Enter Budget">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="deadline">Project Deadline</label>
                        <input type="date" id="deadline" name="deadline">
                    </div>
                    <div class="form-group">
                        <label for="priority">Project Priority</label>
                        <input type="range" id="priority" name="priority" min="1" max="3" value="2">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Message Details</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Enter Subject">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write Your Message Here..."></textarea>
                    </div>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit" class="btn btn-submit">Send Message</button>
                <button type="reset" class="btn btn-reset">Reset</button>
            </div>

        </form>
    </div>

</body>
</html>
