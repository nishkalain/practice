<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styled HTML-Only Login</title>
</head>
<body>

    <center>
        
            
            <legend><h3><b>LOGIN</b></h3></legend>
            
           
                
                <table cellpadding="10">
                    <tr>
                        <td align="right">
                            <label for="username"><b>Username:</b></label>
                        </td>
                        <td>
                            <input type="text" id="username" name="username" placeholder="User ID" required autofocus>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <label for="password"><b>Password:</b></label>
                        </td>
                        <td>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="checkbox" id="remember" name="remember" value="yes">
                            <label for="remember"><small>Remember me</small></label>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="  Sign In  ">
                            <input type="reset" value=" Clear ">
                        </td>
                    </tr>
                </table>

        

            <hr width="90%">

            <p>
                <a href="/forgot"><i>Forgot Password?</i></a>
              
                <a href="/register"><i>Register Account</i></a>
            </p>

        </fieldset>
    </center>

</body>
</html>
