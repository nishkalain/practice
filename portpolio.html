<html>
    <head>
        <title>Portfolio</title>
    </head>
    <body style="background-color:white;   padding: 40px 20px; margin: 0;">
        
        <div style="max-width: 650px; background-color: white; margin: 0 auto; padding: 30px; border-radius: 12px;">
            
            <div style="text-align: center; margin-bottom: 30px;">
                <font size="6" color="black"><strong>Contact Me</strong></font>
                <br><br>
                <font size="2" color="gray">Feel free to contact me for projects, collaborations, internships, or job opportunities.</font>
            </div>

            <form action="#" method="POST">

                <fieldset style="border: 2px solid blue; border-radius: 8px; padding: 20px; margin-bottom: 25px;">
                    <legend style="background-color: blue; color: white; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 14px;">
                        Personal Details
                    </legend>
                    
                    <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                        <div style="flex: 1;">
                            <label for="fname"><font size="2"><strong>Full Name</strong></font></label><br>
                            <input type="text" id="fname" name="full_name" placeholder="Enter Your Full Name" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1;">
                            <label for="email"><font size="2"><strong>Email Address</strong></font></label><br>
                            <input type="email" id="email" name="email" placeholder="Enter Your Email" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;">
                            <label for="phone"><font size="2"><strong>Phone Number</strong></font></label><br>
                            <input type="tel" id="phone" name="phone" placeholder="Enter Mobile Number" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1;">
                            <label for="web"><font size="2"><strong>Portfolio Website</strong></font></label><br>
                            <input type="url" id="web" name="website" placeholder="https://example.com" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                        </div>
                    </div>
                </fieldset>

                <fieldset style="border: 2px solid blue; border-radius: 8px; padding: 20px; margin-bottom: 25px;">
                    <legend style="background-color: blue; color: white; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 14px;">
                        Project Details
                    </legend>
                    
                    <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                        <div style="flex: 1;">
                            <label for="service"><font size="2"><strong>Select Service</strong></font></label><br>
                            <select id="service" name="service" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                                <option>Select Service</option>
                                <option value="web">Web Development</option>
                                <option value="scraping">Web Scraping Pipeline</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="budget"><font size="2"><strong>Project Budget</strong></font></label><br>
                            <input type="text" id="budget" name="budget" placeholder="Enter Budget" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;">
                            <label for="deadline"><font size="2"><strong>Project Deadline</strong></font></label><br>
                            <input type="date" id="deadline" name="deadline" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1;">
                            <label for="priority"><font size="2"><strong>Project Priority</strong></font></label><br>
                            <input type="range" id="priority" name="priority" min="1" max="3" value="2" style="width: 100%; margin-top: 12px; box-sizing: border-box;">
                        </div>
                    </div>
                </fieldset>

                <fieldset style="border: 2px solid blue; border-radius: 8px; padding: 20px; margin-bottom: 30px;">
                    <legend style="background-color: blue; color: white; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 14px;">
                        Message Details
                    </legend>
                    
                    <div style="margin-bottom: 15px;">
                        <label for="subject"><font size="2"><strong>Subject</strong></font></label><br>
                        <input type="text" id="subject" name="subject" placeholder="Enter Subject" style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; box-sizing: border-box;">
                    </div>

                    <div>
                        <label for="msg"><font size="2"><strong>Message</strong></font></label><br>
                        <textarea id="msg" name="message" rows="5" placeholder="Write Your Message Here..." style="width: 100%; padding: 8px; border: 1px solid lightgray; border-radius: 4px; margin-top: 5px; resize: none; box-sizing: border-box;"></textarea>
                    </div>
                </fieldset>

                <div style="display: flex; justify-content: center; gap: 10px;">
                    <button type="submit" style="background-color: green; color: white; border: none; padding: 12px 24px; font-weight: bold; font-family: Arial; border-radius: 6px; cursor: pointer;">Send Message</button>
                    <button type="reset" style="background-color: tomato; color: white; border: none; padding: 12px 24px; font-weight: bold; font-family: Arial; border-radius: 6px; cursor: pointer;">Reset</button>
                </div>

            </form>
            </div>
    </body>
</html>
